name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate operations inventory
        run: npm run ops:validate

      - name: Build
        run: npm run build

      - name: Build MCP server
        run: npm run build -w deftrack-mcp

      - name: Test
        env:
          TEST_POSE_MONGO_URI: mongodb://127.0.0.1:27017/deftrack_pose_test_c1
        run: |
          : "${TEST_POSE_MONGO_URI:?Disposable MongoDB is required for PoSe integration tests}"
          npm run test:ci

      - name: Install Chromium for browser smoke tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e:smoke -w @defcon/client
